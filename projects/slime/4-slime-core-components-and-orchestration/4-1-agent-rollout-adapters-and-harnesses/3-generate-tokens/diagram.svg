<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1830" viewBox="0 0 1200 1830">
<title>动作 3 Generate Tokens 纵向数据流</title>
<desc>消息和工具定义经固定模型模板编码，与生成参数汇合后请求 SGLang。读取 meta_info 中的输出 token、log probability 和结束原因，封装为 TurnRecord 返回 BaseAdapter 共享流程。输入编码是真实计算，后端返回为结构示例。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#4c5f74"/></marker></defs>
<rect width="1200" height="1830" fill="white"/>
<g fill="#19324b" font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="50" y="55" font-size="34" font-weight="700">动作 3：Generate Tokens</text>
<text x="50" y="95" font-size="23" fill="#556d85">Slime Core → SGLang Backend · 同一个请求继续向下读</text>
<rect x="50" y="125" width="1100" height="140" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="72" y="163" font-size="25" font-weight="700">输入：动作 2 的结果 + 原请求与会话配置</text>
<text x="72" y="201" font-size="21">translated：5 条消息；tools_schema：read_file 工具定义</text>
<text x="72" y="235" font-size="21">body.max_tokens：128；Session：默认采样配置、额外上下文上限为 0</text>
<path d="M 330 265 L 330 310" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 900 265 L 900 310" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="315" width="550" height="330" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="72" y="353" font-size="25" font-weight="700">① _render_token_ids()</text>
<text x="72" y="391" font-size="21">输入：translated + tools_schema + tokenizer</text>
<text x="72" y="425" font-size="21">Qwen2.5 模板组织角色、工具定义与历史</text>
<text x="72" y="459" font-size="21">末尾加入 assistant 起始标记</text>
<text x="72" y="493" font-size="21">实际输出 prompt_ids：218 个整数</text>
<text x="72" y="527" font-size="21">前 6 项：151644, 8948, 198,</text>
<text x="72" y="561" font-size="21">105043, 46100, 110498</text>
<text x="72" y="595" font-size="21">完整数值在正文与示例文件中</text>
<rect x="635" y="315" width="515" height="330" rx="14" fill="#effaf3" stroke="#91a6bf" stroke-width="2"/>
<text x="657" y="353" font-size="25" font-weight="700">② _sampling_params()</text>
<text x="657" y="391" font-size="21">在 call_sglang_generate() 内发生</text>
<text x="657" y="425" font-size="21">输入：原 body + Session + 参数键</text>
<text x="657" y="459" font-size="21">输出 sp：max_new_tokens = 128</text>
<text x="657" y="493" font-size="21">skip_special_tokens = false</text>
<text x="657" y="527" font-size="21">spaces_between_special_tokens = false</text>
<text x="657" y="561" font-size="21">no_stop_trim = true</text>
<text x="657" y="595" font-size="21">这一支处理生成选项</text>
<text x="385" y="685" font-size="21" fill="#556d85">先编码，再进入生成函数</text>
<path d="M330 645 V715 H600 V748 M900 645 V715 H600" stroke="#4c5f74" stroke-width="3" fill="none"/>
<path d="M 600 748 L 600 780" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="790" width="980" height="225" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="132" y="828" font-size="25" font-weight="700">③ call_sglang_generate() → POST /generate</text>
<text x="132" y="866" font-size="21">input_ids：完整的 218 项 prompt_ids</text>
<text x="132" y="900" font-size="21">sampling_params：上面的 sp</text>
<text x="132" y="934" font-size="21">rid：本次请求标识；return_logprob：true</text>
<text x="132" y="968" font-size="21">消息与工具定义已编码在 input_ids 中</text>
<path d="M 600 1015 L 600 1060" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="1070" width="980" height="265" rx="14" fill="#fff8ed" stroke="#91a6bf" stroke-width="2"/>
<text x="132" y="1108" font-size="25" font-weight="700">④ SGLang 返回 → 提取 meta_info</text>
<text x="132" y="1146" font-size="21">本例返回为结构示意；未运行模型生成</text>
<text x="132" y="1180" font-size="21">output_token_logprobs 每项：log probability、token ID、附加位置</text>
<text x="132" y="1214" font-size="21">首项示例：[-0.12, 105464, null]</text>
<text x="132" y="1248" font-size="21">output_ids：[105464, 100134, 73345, 1773, 151645]</text>
<text x="132" y="1282" font-size="21">output_log_probs：[-0.12, -0.08, -0.06, -0.03, -0.01]</text>
<text x="132" y="1316" font-size="21">finish_reason：stop</text>
<path d="M 600 1335 L 600 1380" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="1390" width="980" height="265" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="132" y="1428" font-size="25" font-weight="700">⑤ 封装 TurnRecord → 交回 BaseAdapter._run_turn()</text>
<text x="132" y="1466" font-size="21">prompt_ids：218 个输入 IDs</text>
<text x="132" y="1500" font-size="21">output_ids：5 个输出 IDs（演示句子编码 + 结束标记）</text>
<text x="132" y="1534" font-size="21">output_log_probs：5 个对应的演示值</text>
<text x="132" y="1568" font-size="21">finish_reason：stop；ill_formed：默认 false</text>
<text x="132" y="1602" font-size="21">共享流程接收 turn，动作 3 到这里完成</text>
<text x="50" y="1710" font-size="22" fill="#556d85">下一站：解码 → 解析 → 构造客户端响应 → 记录轨迹</text>
<text x="50" y="1750" font-size="21" fill="#556d85">这些步骤继续同一次请求，按后续主题展开。</text>
</g></svg>
