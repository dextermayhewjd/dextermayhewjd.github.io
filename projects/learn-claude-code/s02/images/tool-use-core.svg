<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="s02-core-title s02-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s02-core-title">图 3 · S02：工具接口到本地执行的最小链路</title>
<desc id="s02-core-desc">从模型可见的描述，走到 name / input、名称查表、函数执行与配对结果。</desc>
<defs><marker id="s02-core-base-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker>
<marker id="s02-core-focus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker>
<marker id="s02-core-change-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-change-stroke, #c45656)"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-size="20" font-weight="700" fill="var(--diagram-text, #24334b)">图 3 · S02：工具接口到本地执行的最小链路</text>
<text x="24" y="55" text-anchor="start" font-size="13" font-weight="400" fill="var(--diagram-muted, #58677b)">从模型可见的描述，走到 name / input、名称查表、函数执行与配对结果。</text>
<rect data-stage="schema" x="24" y="96" width="112" height="64" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/>
<text x="80" y="122" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">TOOLS</text>
<text x="80" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">名称 / 描述 / 参数</text>
<rect data-stage="call" x="172" y="96" width="112" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="228" y="122" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">tool_use</text>
<text x="228" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">name + input</text>
<rect data-stage="registry" x="320" y="96" width="112" height="64" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="376" y="122" text-anchor="middle" font-size="11.5" font-weight="650" fill="var(--diagram-text, #24334b)">TOOL_HANDLERS</text>
<text x="376" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">name 映射到函数</text>
<rect data-stage="handler" x="468" y="96" width="112" height="64" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/>
<text x="524" y="122" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">执行函数</text>
<text x="524" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">handler(**input)</text>
<rect data-stage="result" x="616" y="96" width="112" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="672" y="122" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">tool_result</text>
<text x="672" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">调用 ID + 输出</text>
<path d="M136 128H172" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s02-core-base-arrow)"/>
<path d="M284 128H320" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s02-core-base-arrow)"/>
<path d="M432 128H468" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s02-core-base-arrow)"/>
<path d="M580 128H616" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s02-core-base-arrow)"/>
<text x="24" y="194" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">TOOLS 告诉模型怎样调用；TOOL_HANDLERS 告诉程序由哪个函数执行。</text>
<text x="24" y="218" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">本图聚焦接口与分发，完整的工具回传循环保留在图 2。</text>
<rect x="24" y="235" width="11" height="10" rx="2" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)"/>
<text x="43" y="245" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">已有调用 / 回传格式</text>
<rect x="260" y="235" width="11" height="10" rx="2" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)"/>
<text x="279" y="245" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">紫色：新名称映射</text>
<rect x="450" y="235" width="11" height="10" rx="2" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)"/>
<text x="469" y="245" font-size="12" fill="var(--diagram-muted, #58677b)">橙色：接口改造</text>
</svg>
