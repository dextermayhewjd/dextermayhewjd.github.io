<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="s04-evolution-core-title s04-evolution-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s04-evolution-core-title">图 3 · Hook 核心：新机制调度旧行为与新行为</title><desc id="s04-evolution-core-desc">触发与注册机制新增；权限逻辑是已有行为的改造，日志是新增行为。</desc><defs><marker id="s04-evolution-core-base-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker>
<marker id="s04-evolution-core-modified-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-modified-stroke, #b77920)"/></marker>
<marker id="s04-evolution-core-added-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-size="20" font-weight="700" fill="var(--diagram-text, #24334b)">图 3 · Hook 核心：新机制调度旧行为与新行为</text>
<text x="24" y="55" text-anchor="start" font-size="13" font-weight="400" fill="var(--diagram-muted, #58677b)">触发与注册机制新增；权限逻辑是已有行为的改造，日志是新增行为。</text>
<rect data-stage="event" data-change="base" x="24" y="96" width="112" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="80" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">流程到事件</text>
<text x="80" y="143" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">保留的主流程</text>
<rect data-stage="registry" data-change="added" x="172" y="96" width="112" height="64" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="228" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">查 HOOKS</text>
<text x="228" y="143" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">新增事件注册表</text>
<rect data-stage="invoke" data-change="added" x="320" y="96" width="112" height="64" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="376" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">顺序调用</text>
<text x="376" y="143" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">新增回调调度</text>
<rect data-stage="return" data-change="added" x="468" y="96" width="112" height="64" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="524" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">返回结果</text>
<text x="524" y="143" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">首个非 None</text>
<rect data-stage="caller" data-change="base" x="616" y="96" width="112" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="672" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">调用处处理</text>
<text x="672" y="143" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">拦截 / 观察 / 续跑</text>
<path d="M136 128H172" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s04-evolution-core-base-arrow)"/>
