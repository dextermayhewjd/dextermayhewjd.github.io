<path d="M580 128H616" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s04-evolution-core-base-arrow)"/>
<rect data-stage="register" data-change="added" x="172" y="200" width="112" height="58" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="228" y="226" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">注册回调</text>
<text x="228" y="247" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">新增 register_hook</text>
<path d="M228 200V160" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s04-evolution-core-added-arrow)"/>
<rect data-stage="permission-callback" data-change="modified" x="320" y="200" width="112" height="58" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/>
<text x="376" y="226" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">权限回调</text>
<text x="376" y="247" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">原权限逻辑改造</text>
<rect data-stage="new-callback" data-change="added" x="468" y="200" width="112" height="58" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="524" y="226" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">日志回调</text>
<text x="524" y="247" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">本轮新增</text>
<path data-relation="registration" d="M376 160V200" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path data-relation="registration" d="M376 160V183H524V200" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="24" y="296" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">注册关系不等于另一条执行循环；同一调度器可以接已有改造行为和新行为。</text>
<text x="24" y="322" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">回调返回值由触发位置解释，不把所有非 None 都当成阻断整个 Agent。</text>
</svg>
