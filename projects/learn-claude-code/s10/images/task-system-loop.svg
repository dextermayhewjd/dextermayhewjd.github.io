<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="s10-task-loop-title s10-task-loop-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s10-task-loop-title">Task System 的新增部分在基础 Agent Loop 中的位置</title>
<desc id="s10-task-loop-desc">蓝色主线保留 messages、模型请求、PreToolUse、handler、PostToolUse 与配对结果。紫色分支表示选择任务 handler 后进行 TaskStore 文件操作、依赖、状态和负责人校验，再返回 PostToolUse。下方回传线让模型继续决策。模型没有工具调用时触发 Stop，反馈非空才续跑。新增工具 schema 通过模型请求的 TOOLS 提供。</desc>
<defs>
<marker id="s10-task-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker>
<marker id="s10-task-loop-focus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker>
</defs>
<text x="24" y="30" text-anchor="start" font-size="20" font-weight="700" fill="var(--diagram-text, #24334b)">S10 · 在基础循环上加入任务层</text>
<text x="24" y="55" text-anchor="start" font-size="13" font-weight="400" fill="var(--diagram-muted, #58677b)">Permission / Hooks 与基础工具保留；任务工具走同一执行和回传路径。</text>
<text x="439" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">execute_tool() 内部展开</text>
<rect x="24" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="76" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">messages</text>
<text x="76" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">用户与工具结果</text>

<rect x="145" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="197" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">模型请求</text>
<text x="197" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">SYSTEM + TOOLS</text>

<rect x="266" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="318" y="122" text-anchor="middle" font-size="12" font-weight="650" fill="var(--diagram-text, #24334b)">PreToolUse</text>
<text x="318" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">权限与执行前检查</text>

<rect x="387" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="439" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">handler</text>
<text x="439" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">按工具名称分发</text>

<rect x="508" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="560" y="122" text-anchor="middle" font-size="12" font-weight="650" fill="var(--diagram-text, #24334b)">PostToolUse</text>
<text x="560" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">观察执行结果</text>

<rect x="629" y="96" width="104" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="681" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">tool_result</text>
<text x="681" y="143" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">按调用 ID 回传</text>

<path d="M128 128H145" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<path d="M249 128H266" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<path d="M370 128H387" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<path d="M491 128H508" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<path d="M612 128H629" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<rect x="145" y="190" width="104" height="70" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="197" y="216" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">Stop Hook</text>
<text x="197" y="237" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">有反馈才续跑</text>
<text x="197" y="255" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">否则结束</text>

<path d="M197 160V190" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<text x="208" y="177" text-anchor="start" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">无 tool_use</text>
<rect x="300" y="190" width="220" height="110" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="410" y="216" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">新增任务 handler</text>
<text x="410" y="237" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">create_task / update_task</text>
<text x="410" y="255" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">list_tasks / get_task</text>
<text x="410" y="273" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">claim_task / complete_task</text>

<rect x="550" y="190" width="184" height="110" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="642" y="216" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">任务数据与校验</text>
<text x="642" y="237" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">TaskStore / .tasks/</text>
<text x="642" y="255" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">依赖 · 状态 · owner</text>
<text x="642" y="273" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--diagram-muted, #58677b)">每项任务一个 JSON</text>

<path d="M439 160V190" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s10-task-loop-focus-arrow)"/>
<path d="M520 245H550" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s10-task-loop-focus-arrow)"/>
<path d="M642 190V174H560V160" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s10-task-loop-focus-arrow)"/>
<text x="600" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">返回输出</text>
<path d="M681 160V174H746V338H80V160" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s10-task-loop-arrow)"/>
<path d="M197 260V338" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6"/>
<text x="210" y="315" text-anchor="start" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">反馈非空才续跑</text>
<text x="470" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="var(--diagram-text, #24334b)">执行结果追加到 messages → 再问模型</text>
<text x="24" y="365" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">蓝色：S04 基础循环 / 五个工具 / 权限与 Hooks　紫色：S10 新增任务分支</text>
<text x="24" y="388" text-anchor="start" font-size="11" font-weight="400" fill="var(--diagram-muted, #58677b)">UserPromptSubmit 在输入入口触发；图中主线展开获准执行的路径。</text>
</svg>
