<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" role="img" aria-labelledby="team-protocol-title team-protocol-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="team-protocol-title">计划审批：请求匹配与执行闸门</title>
<desc id="team-protocol-desc">审批绑定 request_id、任务和版本；收到文本与允许执行分开。</desc>
<defs><marker id="team-protocol-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">计划审批：请求匹配与执行闸门</text>
<text x="24" y="55" font-size="13" fill="var(--diagram-muted, #58677b)">审批绑定 request_id、任务和版本；收到文本与允许执行分开。</text>
<path data-route="plan-request" data-from="submit" data-to="review" data-kind="flow" data-label="plan_approval_request" d="M244 180H268" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#team-protocol-arrow)"/>
<path data-route="plan-response" data-from="review" data-to="apply" data-kind="flow" data-label="plan_approval_response" d="M488 180H512" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#team-protocol-arrow)"/>
<path data-route="plan-gate" data-from="apply" data-to="gate" data-kind="flow" data-label="仅匹配当前计划才改闸门" d="M732 180H756" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#team-protocol-arrow)"/>
<path data-route="plan-use" data-from="tool" data-to="allow" data-kind="flow" data-label="修改型调用先检查计划与权限" d="M488 440H512" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#team-protocol-arrow)"/>
<path data-route="plan-state" data-from="gate" data-to="allow" data-kind="flow" data-label="闸门约束真正执行" d="M866 260V360" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#team-protocol-arrow)"/>
<rect data-stage="submit" data-change="added" x="24" y="100" width="220" height="160" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="134.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">队友提交计划</text>
<text x="134.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">记录 request_id / task / version</text>
<a class="diagram-function-link" data-function="_teammate_submit_plan" data-function-card="" href="#protocol-submit" aria-label="查看 _teammate_submit_plan 的实现"><text x="134.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="var(--diagram-text, #24334b)" data-function="_teammate_submit_plan">_teammate_submit_plan()</text></a>
<rect data-stage="review" data-change="added" x="268" y="100" width="220" height="160" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="378.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">Lead 审查当前请求</text>
<text x="378.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">改请求状态，发回复</text>
<a class="diagram-function-link" data-function="run_review_plan" data-function-card="" href="#protocol-review" aria-label="查看 run_review_plan 的实现"><text x="378.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="var(--diagram-text, #24334b)" data-function="run_review_plan">run_review_plan()</text></a>
<rect data-stage="apply" data-change="added" x="512" y="100" width="220" height="160" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="622.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">队友匹配响应</text>
<text x="622.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">核对身份、请求与工作版本</text>
<a class="diagram-function-link" data-function="apply_plan_response" data-function-card="" href="#protocol-apply" aria-label="查看 apply_plan_response 的实现"><text x="622.0" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" fill="var(--diagram-text, #24334b)" data-function="apply_plan_response">apply_plan_response()</text></a>
<rect data-stage="gate" data-change="added" x="756" y="100" width="220" height="160" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="866.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">更新 plan_gates</text>
<text x="866.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">approved / rejected</text>
<rect data-stage="tool" data-change="base" x="268" y="360" width="220" height="160" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="378.0" y="385" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">实际修改型工具调用</text>
<text x="378.0" y="406" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">bash / write / edit</text>
<rect data-stage="allow" data-change="modified" x="512" y="360" width="464" height="160" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/>
<text x="744.0" y="385" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">Harness 计划与权限闸门</text>
<text x="744.0" y="406" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #58677b)">approved 或 not_required，再检查非交互权限</text>
<a class="diagram-function-link" data-function="check_permission" data-function-card="" href="#protocol-gate" aria-label="查看 check_permission 的实现"><text x="744.0" y="440" text-anchor="middle" font-family="monospace" font-size="10.5" fill="var(--diagram-text, #24334b)" data-function="check_permission">check_permission()</text></a>
</svg>
