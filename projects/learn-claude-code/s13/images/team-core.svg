<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="s13-core-title s13-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s13-core-title">图 3 · 持久队友的协作循环</title>
<desc id="s13-core-desc">上方是启动到交付；回环和退出放在下方，审批与目录细节见 S13.2–4。</desc>
<defs><marker id="s13-core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">图 3 · 持久队友的协作循环</text>
<text x="24" y="55" font-size="13" fill="var(--diagram-muted, #58677b)">上方是启动到交付；回环和退出放在下方，审批与目录细节见 S13.2–4。</text>
<path data-route="core-start" data-from="spawn" data-to="work" data-kind="flow" data-label="独立线程开始 WORK" d="M244 180H268" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-report" data-from="work" data-to="publish" data-kind="flow" data-label="工具协调／协议消息；终轮非 pending 时发 result，正常空闲发 idle_notification" d="M488 180H512" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-deliver" data-from="publish" data-to="deliver" data-kind="flow" data-label="Lead 在 CLI 等待边界收到事件" d="M732 180H756" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-idle" data-from="work" data-to="idle" data-kind="flow" data-label="一轮结束，进入等待；不退出线程" d="M378 260V360" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-scan" data-from="idle" data-to="claim" data-kind="flow" data-label="等待超时，查找并原子认领任务" d="M268 430H244" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-claimed" data-from="claim" data-to="work" data-kind="flow" data-label="新任务与 cwd 追加到队友历史" d="M134 360V306H330V260" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-message" data-from="publish" data-to="work" data-kind="flow" data-label="队友消息／审批回复在下一次收信时处理" d="M622 260V286H444V260" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-resume" data-from="idle" data-to="work" data-kind="flow" data-label="收到工作消息，继续同一 WORK" d="M468 360V318H462V260" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
<path data-route="core-shutdown" data-from="work" data-to="exit" data-kind="flow" data-label="有效关机请求或异常，退出并清理" d="M488 235H500V340H866V360" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s13-core-arrow)"/>
