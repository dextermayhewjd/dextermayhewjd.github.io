<path data-route="core-permitted" data-from="permission" data-to="call" data-kind="flow" data-label="允许后经 handler 找到 Client 和原名" d="M244 440H268" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s14-core-arrow)"/>
