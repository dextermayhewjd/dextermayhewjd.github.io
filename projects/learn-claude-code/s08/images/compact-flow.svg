<text x="24" y="348" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">无需压缩就直接请求模型；失败时保留原历史。</text>
<rect x="24" y="356" width="11" height="10" rx="2" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)"/>
<text x="43" y="365" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">蓝色：已有流程</text>
<rect x="178" y="356" width="11" height="10" rx="2" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)"/>
<text x="197" y="365" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">紫色：本节机制</text>
