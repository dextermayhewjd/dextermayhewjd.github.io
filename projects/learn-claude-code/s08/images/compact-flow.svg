<rect x="412" y="200" width="126" height="64" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="475" y="226" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">校验候选</text>
