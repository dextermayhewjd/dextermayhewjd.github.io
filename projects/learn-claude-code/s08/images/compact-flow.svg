<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="s08-compact-title s08-compact-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s08-compact-title">S08 · 压缩后接着工作</title>
<desc id="s08-compact-desc">先交齐工具结果；摘要与恢复资料通过校验后才替换历史。</desc>
<defs>
