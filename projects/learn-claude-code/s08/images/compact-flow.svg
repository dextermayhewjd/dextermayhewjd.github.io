<text x="228" y="122" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">检查预算</text>
<text x="228" y="143" text-anchor="middle" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)">超预算或请求压缩</text>
