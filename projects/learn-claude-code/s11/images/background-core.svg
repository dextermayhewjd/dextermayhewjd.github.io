<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="s11-core-title s11-core-desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="s11-core-title">图 3 · 主循环与后台线程的交接</title>
  <desc id="s11-core-desc">主线程选择后台、启动并回传 bg_id 后继续循环；worker 在下面执行并发布完成状态。只有下次循环请求前才收集并注入通知，本轮结束不等待。</desc>
  <defs>
    <marker id="s11-core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)" />
    </marker>
  </defs>
  <text x="24" y="30" font-size="20" fill="var(--diagram-text, #24334b)" font-weight="650">图 3 · 主循环与后台线程的交接</text>
  <text x="24" y="55" font-size="12" fill="var(--diagram-muted, #58677b)">上方是主循环，下方是 worker 与完成队列；点击内部函数查看代码。</text>
  <path data-route="s11-core-choice" data-from="select" data-to="launch" data-kind="flow" data-label="后台标志显式为 True" d="M174 166H210" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-ack" data-from="launch" data-to="continue" data-kind="flow" data-label="启动说明作为原 tool_result 返回" d="M390 166H410" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-next" data-from="continue" data-to="collect" data-kind="flow" data-label="继续进入下一轮 while" d="M556 166H582" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-inject" data-from="collect" data-to="inject" data-kind="flow" data-label="已完成项格式化为通知" d="M762 166H796" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-thread" data-from="launch" data-to="worker" data-kind="flow" data-label="后台线程执行命令" d="M285 230V270H174V340" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-publish" data-from="worker" data-to="queue" data-kind="flow" data-label="持锁发布结果与 ready ID" d="M324 470H348V514H576V465H600" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-drain" data-from="queue" data-to="collect" data-kind="flow" data-label="仅收集已完成项，取走后删除" d="M780 340V270H672V230" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <path data-route="s11-core-end" data-from="continue" data-to="end" data-kind="flow" data-label="没有工具调用且 Stop 不要求继续" d="M483 230V320H471V340" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s11-core-arrow)" />
  <rect data-stage="select" data-change="added" x="24" y="100" width="150" height="130" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5" />
  <text x="99.0" y="125" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">选择后台</text>
  <text x="99.0" y="146" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">仅 Bash 且显式 true</text>
  <a class="diagram-function-link" data-function="should_run_background" data-function-card="select" href="#background-select" aria-label="查看 should_run_background() 的实现">
    <text x="99" y="183" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="should_run_background" font-family="monospace">should_run_background()</text>
  </a>
  <rect data-stage="launch" data-change="added" x="210" y="100" width="180" height="130" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5" />
  <text x="300" y="125" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">登记并启动</text>
  <text x="300" y="146" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">bg_0001 · 立即回复</text>
  <a class="diagram-function-link" data-function="start_background_task" data-function-card="start" href="#background-start" aria-label="查看 start_background_task() 的实现">
    <text x="300" y="183" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="start_background_task" font-family="monospace">start_background_task()</text>
  </a>
  <a class="diagram-function-link" data-function="start" data-function-card="start" href="#background-start" aria-label="查看 BackgroundManager.start() 的实现">
    <text x="300" y="210" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="start" font-family="monospace">BackgroundManager.start()</text>
  </a>
  <rect data-stage="continue" data-change="base" x="410" y="100" width="146" height="130" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5" />
  <text x="483" y="125" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">主循环继续</text>
  <text x="483" y="146" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">处理其他工具 / 请求</text>
  <a class="diagram-function-link" data-function="agent_loop" data-function-card="inject" href="#background-loop" aria-label="查看 agent_loop() 的实现">
    <text x="483" y="183" font-size="11" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="agent_loop" font-family="monospace">agent_loop()</text>
  </a>
  <rect data-stage="collect" data-change="added" x="582" y="100" width="180" height="130" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5" />
  <text x="672.0" y="125" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">收集已完成项</text>
  <text x="672.0" y="146" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">队列空就返回 []</text>
  <a class="diagram-function-link" data-function="collect_background_results" data-function-card="collect" href="#background-collect" aria-label="查看 collect_background_results() 的实现">
    <text x="672" y="183" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="collect_background_results" font-family="monospace">collect_background_results()</text>
  </a>
  <a class="diagram-function-link" data-function="collect" data-function-card="collect" href="#background-collect" aria-label="查看 BackgroundManager.collect() 的实现">
    <text x="672" y="210" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="collect" font-family="monospace">BackgroundManager.collect()</text>
  </a>
  <rect data-stage="inject" data-change="added" x="796" y="100" width="180" height="130" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5" />
  <text x="886.0" y="125" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">请求前注入</text>
  <text x="886.0" y="146" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">user 文本 → 模型输入</text>
  <a class="diagram-function-link" data-function="inject_background_results" data-function-card="inject" href="#background-inject" aria-label="查看 inject_background_results() 的实现">
    <text x="886" y="183" font-size="10" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="inject_background_results" font-family="monospace">inject_background_results()</text>
  </a>
  <rect data-stage="worker" data-change="added" x="24" y="340" width="300" height="150" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5" />
  <text x="174.0" y="365" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">后台线程执行</text>
  <text x="174.0" y="386" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">completed / failed</text>
  <a class="diagram-function-link" data-function="_run" data-function-card="worker" href="#background-worker" aria-label="查看 BackgroundManager._run() 的实现">
    <text x="174" y="424" font-size="11" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="_run" font-family="monospace">BackgroundManager._run()</text>
  </a>
  <a class="diagram-function-link" data-function="_run_bash_process" data-function-card="worker" href="#background-process" aria-label="查看 _run_bash_process() 的实现">
    <text x="174" y="449" font-size="11" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="_run_bash_process" font-family="monospace">_run_bash_process()</text>
  </a>
  <rect data-stage="queue" data-change="added" x="600" y="340" width="350" height="150" rx="9" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-storage-stroke, #8a96a6)" stroke-width="1.5" />
  <text x="775.0" y="365" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">共享的内存状态</text>
  <text x="775.0" y="386" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">tasks / results / _ready / lock</text>
  <a class="diagram-function-link" data-function="__init__" data-function-card="collect" href="#background-state" aria-label="查看 BackgroundManager.__init__() 的实现">
    <text x="775" y="424" font-size="11" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="__init__" font-family="monospace">BackgroundManager.__init__()</text>
  </a>
  <rect data-stage="end" data-change="base" x="396" y="340" width="150" height="110" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5" />
  <text x="471.0" y="365" font-size="14" fill="var(--diagram-text, #24334b)" text-anchor="middle" font-weight="650">本轮可以结束</text>
  <text x="471.0" y="386" font-size="10" fill="var(--diagram-muted, #58677b)" text-anchor="middle">后台可能仍在运行</text>
  <a class="diagram-function-link" data-function="agent_loop" data-function-card="inject" href="#background-loop" aria-label="查看 agent_loop() 的实现">
    <text x="471" y="424" font-size="11" fill="var(--diagram-text, #24334b)" text-anchor="middle" data-function="agent_loop" font-family="monospace">agent_loop()</text>
  </a>
  <text x="24" y="528" font-size="11" fill="var(--diagram-muted, #58677b)">完成通知不是第二个 tool_result；若本轮已返回，下一次进入循环才收集。</text>
  <text x="24" y="550" font-size="11" fill="var(--diagram-muted, #58677b)">后台编号与 S10 任务 ID 无关；进程退出不会保留这些内存记录。</text>
</svg>
