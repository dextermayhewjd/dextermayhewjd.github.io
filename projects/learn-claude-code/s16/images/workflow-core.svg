<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="s16-core-title s16-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s16-core-title">图 3 · 脚本运行与单步结果复用</title><desc id="s16-core-desc">固定步骤留在脚本；缓存命中复用值，未命中调用模型，整次运行结束后回传。</desc>
<defs><marker id="s16-core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">图 3 · 脚本运行与单步结果复用</text>
<text x="24" y="55" font-size="13" fill="var(--diagram-muted, #58677b)">固定步骤留在脚本；缓存命中复用值，未命中调用模型，整次运行结束后回传。</text>
