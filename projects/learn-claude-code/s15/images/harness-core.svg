<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="s15-core-title s15-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s15-core-title">图 3 · 一轮请求如何组装</title><desc id="s15-core-desc">各模块接回消息入口、请求准备、执行与正常收尾；本次不展开错误恢复。</desc>
<defs><marker id="s15-core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker></defs>
