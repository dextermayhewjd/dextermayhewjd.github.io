<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2090" viewBox="0 0 1200 2090">
<title>3.5 完成一次模型请求 纵向数据流</title>
<desc>沿动作三同一份生成记录，依次解码、解析、构造Reply、构造协议响应、记录会话轨迹，再由BaseAdapter处理器返回响应。每框注明实际输入输出，轨迹记录函数返回None并更新会话状态。编号3.5为补充阅读编号。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#4c5f74"/></marker></defs>
<rect width="1200" height="2090" fill="white"/>
<g fill="#19324b" font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="50" y="55" font-size="34" font-weight="700">3.5 完成一次模型请求</text>
<text x="50" y="96" font-size="23" fill="#556d85">接动作 3 的 TurnRecord · 在共享 _run_turn() 中继续</text>
<rect x="70" y="125" width="1060" height="140" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="94" y="163" font-size="25" font-weight="700">输入：turn + translated + tools_schema + body</text>
<text x="94" y="202" font-size="21">输入记录：218 个 prompt IDs、5 个 output IDs、对应 log probability</text>
<text x="94" y="236" font-size="21">图按处理顺序排列；每一框注明它实际使用的数据</text>
<path d="M600 265 V310" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="320" width="980" height="165" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="358" font-size="25" font-weight="700">① tokenizer.decode()</text>
<text x="134" y="397" font-size="21">输入：turn.output_ids；skip_special_tokens = false</text>
<text x="134" y="431" font-size="21">输出 raw_output：这是一个学习项目。&lt;|im_end|&gt;</text>
<text x="134" y="465" font-size="21">本例保留结束标记，解码结果是字符串</text>
<path d="M600 485 V530" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="540" width="980" height="195" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="578" font-size="25" font-weight="700">② parse_model_output()</text>
<text x="134" y="617" font-size="21">输入：raw_output + tools_schema + 解析器配置</text>
<text x="134" y="651" font-size="21">输出 ParsedModelOutput：reasoning、text、tool_uses、ill_formed</text>
<text x="134" y="685" font-size="21">本例 text 保留原字符串；reasoning 为空，tool_uses 为空</text>
<text x="134" y="719" font-size="21">本例未启用专用解析器；工具调用变化可在正文展开查看</text>
<path d="M600 735 V780" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="790" width="980" height="235" rx="14" fill="#effaf3" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="828" font-size="25" font-weight="700">③ _build_reply() → Reply</text>
<text x="134" y="867" font-size="21">输入：parsed + 生成结束原因 stop</text>
<text x="134" y="901" font-size="21">wire：(内容块列表, end_turn) → 给客户端协议响应使用</text>
<text x="134" y="935" font-size="21">manager_message：role=assistant、content=同一段正文 → 给轨迹使用</text>
<text x="134" y="969" font-size="21">finish_reason：stop；共享流程同时更新 turn.ill_formed</text>
<text x="134" y="1003" font-size="21">两类内容来自同一份解析结果</text>
<path d="M600 1025 V1070" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="1080" width="980" height="205" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="1118" font-size="25" font-weight="700">④ _respond() → 客户端 HTTP 响应对象</text>
<text x="134" y="1157" font-size="21">输入：Reply.wire + body + token 数量 + 响应方式</text>
<text x="134" y="1191" font-size="21">本例：非流式 JSON；role=assistant，stop_reason=end_turn</text>
<text x="134" y="1225" font-size="21">usage：input_tokens=218，output_tokens=5</text>
<text x="134" y="1259" font-size="21">这一分支构造响应对象，处理器在记录后返回它</text>
<path d="M600 1285 V1330" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="1340" width="980" height="235" rx="14" fill="#fff8ed" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="1378" font-size="25" font-weight="700">⑤ TrajectoryManager.record_turn()</text>
<text x="134" y="1417" font-size="21">输入：sid + translated + Reply.manager_message + turn + metadata</text>
<text x="134" y="1451" font-size="21">返回：None；更新会话树，记录当前模型输出</text>
<text x="134" y="1485" font-size="21">本例：5 条输入历史 + 1 条新 assistant 消息</text>
<text x="134" y="1519" font-size="21">新助手节点挂有 TurnRecord；已记录轮数变为 1</text>
<text x="134" y="1553" font-size="21">它使用输入与助手输出，不把 HTTP 响应对象当作记录入参</text>
<path d="M600 1575 V1620" stroke="#4c5f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="110" y="1630" width="980" height="205" rx="14" fill="#f1f6fd" stroke="#91a6bf" stroke-width="2"/>
<text x="134" y="1668" font-size="25" font-weight="700">⑥ _run_turn() 返回并退出本轮请求</text>
<text x="134" y="1707" font-size="21">返回第 ④ 步的同一个响应对象</text>
<text x="134" y="1741" font-size="21">finally 移除 inflight[sid] 中的当前任务</text>
<text x="134" y="1775" font-size="21">会话轨迹保留；运行中的 Agent 可以继续发起模型请求</text>
<text x="134" y="1809" font-size="21">这一轮 API 请求完成，整个 Agent 任务可以继续</text>
<text x="50" y="1890" font-size="23" fill="#556d85">阅读下一站：动作 4 Launch Agent，了解谁启动了发请求的 Agent。</text>
<text x="50" y="1935" font-size="21" fill="#556d85">执行顺序：先启动 Agent，再发生 2 → 3 → 3.5 的一轮或多轮请求。</text>
<text x="50" y="1980" font-size="21" fill="#556d85">生成记录沿用结构示例；解码、解析、响应内容与轨迹状态按源码计算。</text>
</g></svg>
