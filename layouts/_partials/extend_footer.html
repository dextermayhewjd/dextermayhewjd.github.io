{{- /* 感悟检索抽屉：全站可开关，数据来自构建时生成的 /notes.json */ -}}
<button class="notes-toggle" type="button" aria-label="打开感悟" title="感悟" aria-controls="notes-drawer" aria-expanded="false" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>
  </svg>
</button>
<div class="notes-backdrop" hidden></div>
<aside id="notes-drawer" class="notes-drawer" role="dialog" aria-modal="true" aria-label="感悟" hidden>
  <div class="notes-root" data-notes-mount data-notes-drawer></div>
</aside>
{{- $js := resources.Get "js/notes.js" | minify | fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"
  data-notes-src="{{ "notes.json" | relURL }}" data-notes-page="{{ "notes/" | relURL }}"></script>
