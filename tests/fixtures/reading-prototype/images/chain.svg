<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="fixture-chain-title" font-family="system-ui,sans-serif"><title id="fixture-chain-title">交互夹具</title><defs><marker id="fixture-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-muted, #58677b)"/></marker></defs><text x="500" y="35" text-anchor="middle" font-size="20" fill="var(--diagram-text, #24334b)">同名函数与文件容器测试夹具</text><path data-route="ca" data-from="caller" data-to="run-a" data-kind="flow" data-label="测试调用关系" d="M260 210H360" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.6" marker-end="url(#fixture-chain-arrow)"/><path data-route="cb" data-from="caller" data-to="run-b" data-kind="flow" data-label="另一测试关系" d="M150 270V310H840V270" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.6" marker-end="url(#fixture-chain-arrow)"/><g data-file-id="entry" data-file-path="entry.py"><rect data-file-group="true" x="20" y="100" width="260" height="360" rx="8" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-muted, #58677b)" stroke-width="1.5"/><text x="150.0" y="130" text-anchor="middle" font-size="13" fill="var(--diagram-text, #24334b)">entry.py</text><rect data-stage="caller" data-source-ref="caller" x="40" y="150" width="220" height="120" rx="8" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-muted, #58677b)" stroke-width="1.5"/><text x="150.0" y="180" text-anchor="middle" font-size="13" fill="var(--diagram-text, #24334b)">测试片段</text><a class="diagram-function-link" data-function="caller" data-function-card="entry" href="#source-caller"><text x="150.0" y="215" text-anchor="middle" font-size="12" fill="var(--diagram-text, #24334b)" data-function="caller">generate</text></a></g><g data-file-id="a" data-file-path="a.py"><rect data-file-group="true" x="340" y="100" width="300" height="360" rx="8" fill="var(--diagram-storage-