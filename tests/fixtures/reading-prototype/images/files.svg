<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="fixture-files-title" font-family="system-ui,sans-serif"><title id="fixture-files-title">交互夹具</title><defs><marker id="fixture-files-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-muted, #58677b)"/></marker></defs><text x="600" y="35" text-anchor="middle" font-size="20" fill="var(--diagram-text, #24334b)">文件进度测试夹具</text><path data-route="fa" data-from="file-entry" data-to="file-a" data-kind="reference" data-label="合成文件关系" d="M360 158H440" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.6" marker-end="url(#fixture-files-arrow)"/><path data-route="fb" data-from="file-entry" data-to="file-b" data-kind="reference" data-label="合成文件关系" d="M200 196V230H1000V196" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.6" marker-end="url(#fixture-files-arrow)"/><a data-module="entry" href="#source-caller" class="diagram-module-link"><rect data-stage="file-entry" data-file-path="entry.py" x="40" y="120" width="320" height="76" rx="8" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-muted, #58677b)" stroke-width="1.5"/><text x="200" y="150" text-anchor="middle" font-size="13" fill="var(--diagram-text, #24334b)">entry.py</text><text x="200" y="175" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">本章范围与自检，不表示整文件掌握</text></a><a data-module="a" href="#source-caller" class="diagram-module-link"><rect data-stage="file-a" data-file-path="a.py" x="440" y="120" width="320" height="76" rx="8" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-muted, #58677b)" stroke-width="1.5"/><text x="600" y="150" text-anchor="middle" font-size="13" fill="var(--diagram-text, #24334b)">a.py</text><text x="600" y="175" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">本章范围与自检，不表示整文件掌握</text></a><a data-module="b" href="