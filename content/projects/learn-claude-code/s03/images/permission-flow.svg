<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="s03-after-title s03-after-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s03-after-title">图 2 · S03：保留文件工具，加入权限检查</title>
