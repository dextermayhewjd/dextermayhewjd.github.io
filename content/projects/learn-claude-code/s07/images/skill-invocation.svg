<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="s07-invocation-title s07-invocation-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s07-invocation-title">C · 两种调用入口，进入同一准备阶段</title><desc id="s07-invocation-desc">用户直接点名与模型自行选择分别判断；调用被允许后才装载正文。</desc>
<defs><marker id="s07-invocation-base-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker><marker id="s07-invocation-focus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">C · 两种调用入口，进入同一准备阶段</text>
<text x="24" y="55" text-anchor="start" font-size="13" fill="var(--diagram-muted, #58677b)">用户直接点名与模型自行选择分别判断；调用被允许后才装载正文。</text>
<rect data-stage="user" x="24" y="96" width="172" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="110" y="122" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">用户点名</text>
<text x="110" y="143" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">/review-diff</text>
<rect data-stage="model" x="24" y="218" width="172" height="64" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="110" y="244" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">模型选择</text>
<text x="110" y="265" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">依据可见目录与任务</text>
<rect data-stage="policy" x="248" y="154" width="160" height="80" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="328" y="180" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">调用边界</text>
<text x="328" y="201" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">当前是否可用？</text>
<text x="328" y="220" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">调用是否获准？</text>
<rect data-stage="prepare" x="440" y="154" width="136" height="80" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="508" y="180" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">准备正文</text>
<text x="508" y="201" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">读取并处理</text>
<text x="508" y="220" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">不是执行每句指令</text>
<rect data-stage="target" x="608" y="154" width="128" height="80" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="672" y="180" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">目标会话</text>
<text x="672" y="201" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">接收指令</text>
<text x="672" y="220" text-anchor="middle" font-size="10.5" fill="var(--diagram-muted, #58677b)">继续模型决策</text>
<path d="M196 128H222V194H248" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.5" marker-end="url(#s07-invocation-base-arrow)"/>
<path d="M196 250H222V194H248" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.5" marker-end="url(#s07-invocation-base-arrow)"/>
<path d="M408 194H440" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.5" marker-end="url(#s07-invocation-base-arrow)"/>
<path d="M576 194H608" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.5" marker-end="url(#s07-invocation-base-arrow)"/>
<text x="24" y="323" text-anchor="start" font-size="12" fill="var(--diagram-muted, #58677b)">默认配置支持两个入口；调用开关与失败处理看本节正文，权限细节看 07.6。</text>
</svg>
