  <title id="s16-step05-title">完整工作流的输入、函数边界与返回结果</title>
  <desc id="s16-step05-desc">args 提供 changes，ctx 提供模型调用能力。sample_workflow 函数内先检查，再逐条复核与筛选，形成 confirmed，最后返回包含 confirmed 列表的对象。虚线表示 ctx 提供调用能力，实线表示输入与结果传递。</desc>
