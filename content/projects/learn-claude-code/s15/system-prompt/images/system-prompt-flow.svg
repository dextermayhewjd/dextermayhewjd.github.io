<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="s15-prompt-content-title s15-prompt-content-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s15-prompt-content-title">System Prompt 的内容组成</title>
<desc id="s15-prompt-content-desc">固定规则和动态背景构成 SYSTEM。SYSTEM、messages 和 tools 作为独立输入交给模型；此图解释内容来源，不表示运行循环或缓存流程。</desc>
<defs><marker id="s15-prompt-content-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker></defs>
<text x="24" y="30" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">S15.1 · System Prompt 的内容组成</text>
<text x="24" y="55" font-size="13" fill="var(--diagram-muted, #58677b)">固定规则与动态背景进入 SYSTEM；历史和工具定义各有输入字段。</text>
<path data-route="prompt-fixed" data-from="fixed" data-to="system" data-kind="flow" data-label="预定义规则组成基础说明" d="M244 161H274V222H308" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s15-prompt-content-arrow)"/>
<path data-route="prompt-background" data-from="background" data-to="system" data-kind="flow" data-label="当前时间和按条件加入的目录／正文" d="M244 321H286V276H308" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s15-prompt-content-arrow)"/>
<path data-route="prompt-system-input" data-from="system" data-to="request" data-kind="flow" data-label="只填入本轮请求的 system 字段" d="M496 256H552" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s15-prompt-content-arrow)"/>
<path data-route="prompt-history-input" data-from="messages" data-to="request" data-kind="flow" data-label="用户问题、响应和工具结果填入 messages" d="M644 148V184" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s15-prompt-content-arrow)"/>
<path data-route="prompt-tools-input" data-from="tools" data-to="request" data-kind="flow" data-label="可调用名称与参数 schema 填入 tools" d="M644 365V328" fill="none" stroke="var(--diagram-line, #65748a)" stroke-width="1.6" marker-end="url(#s15-prompt-content-arrow)"/>
<rect data-stage="fixed" x="24" y="100" width="220" height="126" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="134" y="126" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">固定规则</text>
<text x="134" y="155" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">身份／工具说明／工作区</text>
<text x="134" y="180" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">任务／团队约定</text>
<text x="134" y="205" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">记忆／压缩后的背景读法</text>
<rect data-stage="background" x="24" y="260" width="220" height="126" rx="9" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-storage-stroke, #8a96a6)" stroke-width="1.5"/>
<text x="134" y="286" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">动态背景</text>
<text x="134" y="315" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">时间／Skills 目录</text>
<text x="134" y="340" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">Memory 目录与选中记录</text>
<text x="134" y="365" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">已连接 MCP 名称</text>
<rect data-stage="system" x="308" y="184" width="188" height="144" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/>
<text x="402" y="215" text-anchor="middle" font-size="16" font-weight="650" fill="var(--diagram-text, #24334b)">SYSTEM</text>
<text x="402" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">固定说明 + 按需背景</text>
<text x="402" y="277" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">Harness 拼成字符串</text>
<text x="402" y="306" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">本节关注内容组成</text>
<rect data-stage="request" x="552" y="184" width="184" height="144" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="644" y="215" text-anchor="middle" font-size="15" font-weight="650" fill="var(--diagram-text, #24334b)">本轮模型输入</text>
<text x="644" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">system</text>
<text x="644" y="277" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">messages</text>
<text x="644" y="306" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">tools</text>
<rect data-stage="messages" x="552" y="80" width="184" height="68" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="644" y="107" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">messages</text>
<text x="644" y="133" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">任务／历史／结果／通知</text>
<rect data-stage="tools" x="552" y="365" width="184" height="68" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/>
<text x="644" y="392" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">tools</text>
<text x="644" y="418" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #58677b)">名称／描述／参数 schema</text>
<text x="24" y="442" font-size="12" fill="var(--diagram-muted, #58677b)">完整执行顺序在 S15 主章；此处不重复主循环。</text>
</svg>
