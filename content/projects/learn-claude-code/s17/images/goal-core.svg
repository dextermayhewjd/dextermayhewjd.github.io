<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="s17-core-title s17-core-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s17-core-title">图 3 · Goal Gate 决定是否允许结束</title><desc id="s17-core-desc">独立 S17 的控制边界；无工具轮才判断，block 将原因追加回同一循环，其余状态交还调用者。</desc>
<defs><marker id="s17-core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="650" fill="var(--diagram-text, #24334b)">图 3 · 原退出分支加入完成条件检查</text>
<text x="500" y="55" text-anchor="middle" font-size="13" fill="var(--diagram-text, #24334b)">评估器没有工具；续轮仍在原 while；后台由宿主另行交付</text>
<path data-route="input-work" data-from="command" data-to="worker" data-kind="flow" data-label="保存目标并立即执行" d="M244 180H268" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="work-gate" data-from="worker" data-to="gate" data-kind="flow" data-label="无 tool_use 才进入 Gate" d="M488 180H512" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="gate-eval" data-from="gate" data-to="evaluator" data-kind="flow" data-label="有目标且无未完成后台工作" d="M732 180H756" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="eval-gate" data-from="evaluator" data-to="gate" data-kind="flow" data-label="返回合法判断或评估错误" d="M866 280V320H622V280" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="gate-feedback" data-from="gate" data-to="feedback" data-kind="flow" data-label="block：条件仍未满足，未超过上限" d="M550 280V340H378V390" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="feedback-work" data-from="feedback" data-to="worker" data-kind="flow" data-label="把条件与缺失原因加入同一 messages，continue" d="M340 390V360H256V178H268" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="input-state" data-from="command" data-to="state" data-kind="reference" data-label="设置时记录目标状态" d="M134 280V390" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path data-route="state-gate" data-from="state" data-to="gate" data-kind="reference" data-label="读取活跃条件与计数" d="M244 460H250V308H580V280" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path data-route="gate-return" data-from="gate" data-to="return" data-kind="flow" data-label="allow / achieved / failed / defer / limit / error 均返回" d="M700 280V350H866V390" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<path data-route="return-background" data-from="return" data-to="background" data-kind="reference" data-label="defer 后：宿主稍后交付结果（可选）" d="M756 480H732" fill="none" stroke="var(--diagram-muted, #58677b)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path data-route="background-work" data-from="background" data-to="worker" data-kind="flow" data-label="有活跃目标：先追加结果，再进入工作循环" d="M622 390V330H300V280" fill="none" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.6" marker-end="url(#s17-core-arrow)"/>
<rect data-stage="command" data-change="modified" x="24" y="100" width="220" height="180" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/><text x="134.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">命令与条件</text><text x="134.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">/goal 查看／清除直接返回</text><a class="diagram-function-link" data-function="submit" data-function-card="command" href="#goal-submit" aria-label="查看 AgentSession.submit() 实现"><text x="134.0" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="submit">AgentSession.submit()</text></a><a class="diagram-function-link" data-function="set_goal" data-function-card="command" href="#goal-submit" aria-label="查看 GoalController.set_goal() 实现"><text x="134.0" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="set_goal">GoalController.set_goal()</text></a>
<rect data-stage="worker" data-change="base" x="268" y="100" width="220" height="180" rx="9" fill="var(--diagram-base-fill, #edf3fc)" stroke="var(--diagram-base-stroke, #537cc0)" stroke-width="1.5"/><text x="378.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">原工作循环</text><text x="378.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">工具轮写回结果，暂不评估</text><a class="diagram-function-link" data-function="_run_query" data-function-card="loop" href="#goal-query" aria-label="查看 AgentSession._run_query() 实现"><text x="378.0" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="_run_query">AgentSession._run_query()</text></a>
<rect data-stage="gate" data-change="added" x="512" y="100" width="220" height="180" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/><text x="622.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">退出门与决定</text><text x="622.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">无目标 allow；后台未完 defer</text><a class="diagram-function-link" data-function="evaluate_after_turn" data-function-card="gate" href="#goal-gate" aria-label="查看 GoalController.evaluate_after_turn() 实现"><text x="622.0" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="evaluate_after_turn">GoalController.evaluate_after_turn()</text></a><a class="diagram-function-link" data-function="begin_query" data-function-card="gate" href="#goal-gate" aria-label="查看 GoalController.begin_query() 实现"><text x="622.0" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="begin_query">GoalController.begin_query()</text></a>
<rect data-stage="evaluator" data-change="added" x="756" y="100" width="220" height="180" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/><text x="866.0" y="125" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">证据与评估</text><text x="866.0" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">独立请求，无 tools 参数</text><a class="diagram-function-link" data-function="_evaluate_sync" data-function-card="judge" href="#goal-evaluator" aria-label="查看 PromptGoalEvaluator._evaluate_sync() 实现"><text x="866.0" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="_evaluate_sync">PromptGoalEvaluator._evaluate_sync()</text></a><a class="diagram-function-link" data-function="transcript_text" data-function-card="judge" href="#goal-evaluator" aria-label="查看 transcript_text() 实现"><text x="866.0" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="transcript_text">transcript_text()</text></a><a class="diagram-function-link" data-function="_parse_json_object" data-function-card="judge" href="#goal-evaluator" aria-label="查看 _parse_json_object() 实现"><text x="866.0" y="216" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="_parse_json_object">_parse_json_object()</text></a>
<rect data-stage="state" data-change="storage" x="24" y="390" width="220" height="180" rx="9" fill="var(--diagram-storage-fill, #f3f5f8)" stroke="var(--diagram-storage-stroke, #8a96a6)" stroke-width="1.5"/><text x="134.0" y="415" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">状态与事件</text><text x="134.0" y="436" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">只有宿主保存才跨进程恢复</text><a class="diagram-function-link" data-function="status" data-function-card="state" href="#goal-state" aria-label="查看 GoalController.status() 实现"><text x="134.0" y="462" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="status">GoalController.status()</text></a><a class="diagram-function-link" data-function="clear" data-function-card="state" href="#goal-state" aria-label="查看 GoalController.clear() 实现"><text x="134.0" y="484" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="clear">GoalController.clear()</text></a><a class="diagram-function-link" data-function="_record" data-function-card="state" href="#goal-state" aria-label="查看 GoalController._record() 实现"><text x="134.0" y="506" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="_record">GoalController._record()</text></a><a class="diagram-function-link" data-function="restore" data-function-card="state" href="#goal-state" aria-label="查看 GoalController.restore() 实现"><text x="134.0" y="528" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="restore">GoalController.restore()</text></a>
<rect data-stage="feedback" data-change="added" x="268" y="390" width="220" height="180" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/><text x="378.0" y="415" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">原因写回续轮</text><text x="378.0" y="436" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">新 user 消息，不是 tool_result</text><a class="diagram-function-link" data-function="_run_query" data-function-card="loop" href="#goal-query" aria-label="查看 AgentSession._run_query() 实现"><text x="378.0" y="462" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="_run_query">AgentSession._run_query()</text></a>
<rect data-stage="background" data-change="added" x="512" y="390" width="220" height="180" rx="9" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" stroke-width="1.5"/><text x="622.0" y="415" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">宿主稍后交付</text><text x="622.0" y="436" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">可选接口，CLI 未自动接线</text><a class="diagram-function-link" data-function="submit_background_result" data-function-card="background" href="#goal-background" aria-label="查看 AgentSession.submit_background_result() 实现"><text x="622.0" y="462" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="submit_background_result">AgentSession.submit_background_result()</text></a>
<rect data-stage="return" data-change="modified" x="756" y="390" width="220" height="180" rx="9" fill="var(--diagram-modified-fill, #fff3dc)" stroke="var(--diagram-modified-stroke, #b77920)" stroke-width="1.5"/><text x="866.0" y="415" text-anchor="middle" font-size="14" font-weight="650" fill="var(--diagram-text, #24334b)">交还控制权</text><text x="866.0" y="436" text-anchor="middle" font-size="10" fill="var(--diagram-text, #24334b)">Stop 摘要 → SessionResult</text><a class="diagram-function-link" data-function="evaluate_after_turn" data-function-card="gate" href="#goal-limits" aria-label="查看 GoalController.evaluate_after_turn() 实现"><text x="866.0" y="462" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--diagram-text, #24334b)" data-function="evaluate_after_turn">GoalController.evaluate_after_turn()</text></a>
<text x="500" y="610" text-anchor="middle" font-size="12" fill="var(--diagram-text, #24334b)">工具轮的 PreToolUse → 执行 → PostToolUse 保持原逻辑；本文核心只展开 Goal 控制边界</text>
<text x="450" y="335" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #58677b)">block</text>
<text x="800" y="314" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #58677b)">判断返回</text>
<text x="824" y="344" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #58677b)">非 block</text>
</svg>
