<text x="43" y="330" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)" data-evolution-legend="true">保留的工具与循环</text>
<rect x="236" y="320" width="11" height="10" rx="2" fill="var(--diagram-memory-fill, #f3edfc)" stroke="var(--diagram-memory-stroke, #8855b5)" data-evolution-legend="true"/>
<text x="255" y="330" text-anchor="start" font-size="12" font-weight="400" fill="var(--diagram-muted, #58677b)" data-evolution-legend="true">S03 新增的权限判断</text>
