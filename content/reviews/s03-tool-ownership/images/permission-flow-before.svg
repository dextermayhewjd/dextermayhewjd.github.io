<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="s03-review-before-title s03-review-before-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="s03-review-before-title">图 2 · S03：在执行入口加权限判断</title>
<desc id="s03-review-before-desc">紫色是新增权限层；原工具、执行模块、停止动作与回传继续保留。</desc>
<defs><marker id="s03-review-before-base-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #65748a)"/></marker>
<marker id="s03-review-before-change-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-change-stroke, #c45656)"/></marker>
<marker id="s03-review-before-focus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-memory-stroke, #8855b5)"/></marker></defs>
<text x="24" y="30" text-anchor="start" font-size="20" font-weight="700" fill="var(--diagram-text, #24334b)">图 2 · S03：在执行入口加权限判断</text>
<text x="24" y="55" text-anchor="start" font-size="13" font-weight="400" fill="var(--diagram-muted, #58677b)">紫色是新增权限层；原工具、执行模块、停止动作与回传继续保留。</text>
