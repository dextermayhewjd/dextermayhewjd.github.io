<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc">
<title id="title">Launch Agent：run 调度与执行前准备</title><desc id="desc">generate 调用 Harness.run。run 调度用户准备、上下文、配置、启动信息形成。Harness 通过沙箱接口落实准备，Sandbox 接收并准备执行。在真正启动 CLI 的接缝停止，动作六继续解释执行和等待。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:22px;fill:#172334}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:700}.small{font-size:20px}.muted{fill:#526173}.mono{font-family:"DejaVu Sans Mono",monospace;font-size:20px}.box{stroke:#91a3b8;stroke-width:2;rx:14}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="1340" fill="#fff"/><text x="50" y="52" class="title">动作 4：run() 调度 Agent 启动</text><text x="50" y="91" class="muted">先看 Harness 做什么，再沿动作 5 下钻 Sandbox；到 CLI 执行前停下</text>
<rect x="50" y="122" width="1100" height="134" class="box" fill="#eff6ff"/><text x="75" y="163" class="head">Slime 侧 generate() → HARNESS_CLS().run(...)</text><text x="75" y="202" class="mono">sb + workdir + session_id + adapter_url + prompt + time_budget_sec</text><text x="75" y="238" class="small muted">环境与任务参数已准备；所选对象继承公共 BaseHarness.run()</text><path d="M600 256 V298" class="arrow"/>
<rect x="50" y="302" width="1100" height="661" class="box" fill="#f0fdf4"/><text x="75" y="344" class="head">Harness.run()：共同调度骨架</text>
<rect x="75" y="373" width="1050" height="111" class="box" fill="#fff"/><text x="100" y="414" class="head">① ensure_agent_user() + HarnessContext</text><text x="100" y="455" class="small">确认用户、权限；保留目录、会话和模型入口，指令与预算独立传递</text><path d="M600 484 V520" class="arrow"/>
<rect x="75" y="524" width="1050" height="141" class="box" fill="#fff"/><text x="100" y="565" class="head">② self.write_config(sb, ctx)</text><text x="100" y="605" class="small">子类准备 JSON / TOML 配置，向 sb 提交写文件与权限操作</text><text x="100" y="643" class="small muted">Harness 决定内容；Sandbox 落实环境副作用（动作 5）</text><path d="M600 665 V701" class="arrow"/>
<rect x="75" y="705" width="1050" height="224" class="box" fill="#fff"/><text x="100" y="746" class="head">③ self.launch_and_wait(sb, ctx, prompt, budget)</text><text x="100" y="788" class="small">组装 CLI 命令 cmd 与进程环境 env → run_agent()</text><text x="100" y="829" class="small">准备日志目录 → 将运行要求交给 exec_and_wait()</text><text x="100" y="870" class="small muted">run() 的 wait 覆盖下游执行；此处先读准备与委派</text><text x="100" y="908" class="small muted">不在动作 4 展开 CLI 的运行循环与模型请求</text><path d="M600 963 V1004" class="arrow"/>
<rect x="50" y="1008" width="1100" height="164" class="box" fill="#fff7ed"/><text x="75" y="1049" class="head">动作 5 下钻：Harness 操作 → Sandbox 接收与准备</text><text x="75" y="1090" class="small">落实用户、权限和配置；写启动脚本、清理旧状态、准备执行请求</text><text x="75" y="1131" class="small muted">两端都要读：Harness 提什么要求，Sandbox 怎样实现并返回结果</text>
<path d="M50 1204 H1150" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 8"/><text x="75" y="1247" class="head">CLI 真正执行的接缝 → 动作 6 Exec Commands</text><text x="75" y="1290" class="small muted">从准备好的启动命令进入 CLI 进程执行与完成等待；本图在此停止</text>
</svg>
